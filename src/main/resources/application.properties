spring.application.name=employee-api
# JPA/DataSource autoconfiguration is off by default: DynamoDB is the active store
# (Act 3) and JpaEmployeeRepository is dormant. Without this, Spring Data JPA still
# scans SpringDataEmployeeJpaRepository and eagerly requires a reachable MySQL just
# to start the app. JpaEmployeeRepositoryTest re-enables JPA explicitly for itself.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Datasource — dormant since Act 3, kept so JpaEmployeeRepositoryTest still has a
# working config when it re-enables JPA autoconfiguration for its own context.
spring.datasource.url=jdbc:mysql://localhost:3310/employee_db
spring.datasource.username=kata
spring.datasource.password=kata
spring.jpa.hibernate.ddl-auto=update

# DynamoDB (Testcontainers overrides these in tests). Points at the localstack
# service in compose.yaml for local bootRun.
aws.dynamodb.endpoint=http://localhost:4570
aws.dynamodb.region=us-east-1
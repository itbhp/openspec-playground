plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.6.0'
}

group = 'com.systemservices.kata'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA + MySQL (used in Phase 1 — commented out until needed)
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // runtimeOnly 'com.mysql:mysql-connector-j'

    // DynamoDB SDK v2 (used in Phase 2 — commented out until needed)
    // implementation 'software.amazon.awssdk:dynamodb:2.25.60'
    // implementation 'software.amazon.awssdk:url-connection-client:2.25.60'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:localstack'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.19.8"
    }
}

// openapi-generator — wired but won't run until a spec file exists
openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$projectDir/src/main/resources/openapi/employee-api-v1.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = 'com.kata.employee.api'
    modelPackage = 'com.kata.employee.model'
    configOptions = [
            interfaceOnly  : 'true',
            useSpringBoot3 : 'true',
            useTags        : 'true',
            openApiNullable: 'false',
    ]
}

sourceSets.main.java.srcDir "$buildDir/generated/src/main/java"
// compileJava.dependsOn tasks.openApiGenerate  ← uncomment when spec is ready